<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mocha's Ghost Town</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mocha"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#26324a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{--ink:#26324a;--paper:#fffaf2;--accent:#e9886b;--teal:#3f8f8a;--line:#ece4d8;--soft:#f3efe8;--mut:#9a958c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#2b3a52;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);touch-action:manipulation;overscroll-behavior:none}
  canvas#c{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  .pill{white-space:nowrap;background:var(--paper);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.16);display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
  #top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
  #top>*{pointer-events:auto}
  #leftTop{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
  .status{background:#e6f2ef;color:var(--teal);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;max-width:38vw;overflow:hidden;text-overflow:ellipsis}
  .lvl{background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px}
  #sky{font-size:12px;padding:5px 11px;font-weight:700;color:#5b6577}
  #meters{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.16);font-size:11px;font-weight:700;display:grid;grid-template-columns:auto 70px;gap:4px 8px;align-items:center}
  .bar{height:7px;border-radius:9px;background:#efe9df;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
  #mindBtn{border:0;cursor:pointer;font:inherit;background:linear-gradient(90deg,#ffd9c2,#ffe9a8);color:var(--ink);font-weight:800;font-size:13px;display:none}
  #mindBtn.on{background:#e6f2ef;color:var(--teal);cursor:default}
  #panel{position:fixed;top:190px;right:12px;width:360px;max-height:calc(100% - 280px);background:var(--paper);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s,opacity .35s}
  #panel.hidden{transform:translateX(120%);opacity:0;pointer-events:none}
  #panel header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
  #panel header b{font-size:16px}
  .x{border:0;background:var(--soft);width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
  nav{display:flex;gap:3px;padding:4px 10px 10px;flex-wrap:wrap}
  nav button{border:0;border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;background:transparent;color:var(--mut);cursor:pointer}
  nav button.on{background:var(--ink);color:#fff}
  .tab{overflow-y:auto;padding:0 16px 20px;display:none;flex:1;min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}.tab.on{display:block}
  .entry{border-top:1.5px dashed var(--line);padding:11px 0;font-size:14px;line-height:1.45;animation:pop .5s}
  .entry .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:700}
  .tag{border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:#7d7668}
  .tag.big{border-color:#f5c7b4;color:#c0603f;background:#fff0e8}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}}
  h4{margin:14px 0 6px;font-size:13px;color:var(--teal)}
  .chip{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 10px;margin:3px 4px 3px 0;font-size:13px}
  .chip.dis{background:#f6e9e9;color:#a26464}
  .chip .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
  .muted{color:var(--mut);font-size:13px}
  .row{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
  .row small{color:var(--mut);font-weight:700;text-align:right}
  .goal{background:#fff0e8;border-radius:14px;padding:10px 12px;font-size:14px}
  .fact{background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:13.5px;line-height:1.45}
  .fact b{display:block;margin-bottom:4px;color:var(--teal)}
  #diaryBtn{position:fixed;top:190px;right:12px;display:none}
  #panel.hidden~#diaryBtn{display:inline-flex}
  button.pill{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
  #mini{position:fixed;left:12px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));width:124px;height:124px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer}
  #chatwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(520px,calc(100% - 24px))}
  #chatlog{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;align-items:flex-end;pointer-events:none}
  .msg{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:14px;max-width:80%;transition:opacity 1s}
  form#chat{display:flex;gap:8px;background:var(--paper);border-radius:999px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
  form#chat input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;padding:6px 10px;outline:none;color:var(--ink);min-width:0}
  form#chat button{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:800;border-radius:999px;padding:8px 16px;cursor:pointer}
  #bubble,#bubble2,#bubble3{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--paper);border-radius:16px;padding:8px 12px;font-size:14px;max-width:250px;box-shadow:0 4px 0 rgba(0,0,0,.16);pointer-events:none;opacity:0;transition:opacity .3s;text-align:center;line-height:1.35;z-index:3}
  #bubble:after,#bubble2:after,#bubble3:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
  #bubble.show,#bubble2.show,#bubble3.show{opacity:1}
  #bubble.think,#bubble2.think,#bubble3.think{font-style:italic;color:var(--teal)}
  .lbl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:rgba(255,250,242,.94);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.13);transition:opacity .3s}
  .lbl.new{background:#fff0e8;color:#c0603f}
  .lbl.home{background:var(--accent);color:#fff}
  #toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap;z-index:4;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast{white-space:normal;width:max-content;text-align:center;border-radius:18px;line-height:1.3;padding:0 16px;border:solid transparent;border-width:8px 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
  .danger{border:0;background:#fbe3e3;color:#a63c3c;font:inherit;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;margin-top:14px}
  #hint{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-size:12px;font-weight:700;opacity:.85;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:opacity 1s;white-space:nowrap}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:30px}
  nav{flex-wrap:wrap;row-gap:4px}nav button{white-space:nowrap;flex:none;padding:6px 9px}
  #panel{z-index:5}#panel header{position:relative}.grab{display:none}.hbtns{display:flex;gap:6px}
  #camctl{position:fixed;right:12px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:2}
  #edge{position:fixed;left:0;top:0;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.18);display:none;align-items:center;justify-content:center;font-size:20px;cursor:pointer;z-index:3;border:2px solid var(--accent)}
  form#chat #micBtn{background:var(--soft);color:var(--ink);padding:8px 12px;display:none}
  form#chat #micBtn.on{background:var(--accent);color:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(233,136,107,.25)}}
  .post{border-top:1.5px dashed var(--line);padding:12px 0}.post img,.post .pic{display:block;margin:0 auto;max-width:100%;max-height:min(34vh,300px);width:auto;height:auto;border-radius:12px;background:var(--soft);cursor:zoom-in}.post .pic.art{border:6px solid #b08a3a;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}.post .cap{font-size:15px;margin:8px 0 4px;line-height:1.4}.post .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);font-weight:700}
  .nophoto{background:var(--soft);border-radius:14px;padding:30px;text-align:center;color:var(--mut);font-size:13px}
  .heart{border:0;background:var(--soft);border-radius:999px;padding:4px 10px;font:inherit;cursor:pointer;color:#c0603f;font-weight:800}.heart.on{background:#fde3dc}
  .set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1.5px dashed var(--line);font-size:14px;font-weight:700}
  .set small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:2px}
  .tog{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#ddd5c8;position:relative;cursor:pointer;flex:none;transition:.2s;margin:0}.tog:checked{background:var(--teal)}.tog:before{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.tog:checked:before{left:21px}
  .seg{display:flex;gap:4px;flex-wrap:wrap}.seg button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}.seg button.on{border-color:var(--ink);background:var(--soft)}
  @media (max-width:760px){
    #panel{left:0;right:0;width:auto;top:auto;max-height:none;height:min(var(--sheetH,55dvh),calc(100dvh - 140px - env(safe-area-inset-bottom) - env(safe-area-inset-top)));bottom:calc(62px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
    #panel.dragging{transition:none}
    #panel.hidden{transform:translateY(130%)}
    .grab{display:block;position:absolute;left:50%;top:7px;width:46px;height:5px;margin-left:-23px;border-radius:3px;background:#d9d0c2}
    #panel header{padding:20px 16px 4px;touch-action:none}
    .tab{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
    #diaryBtn{top:auto;bottom:calc(146px + env(safe-area-inset-bottom));right:12px}
    #camctl{bottom:calc(196px + env(safe-area-inset-bottom))}
    #mini{width:88px;height:88px;bottom:calc(146px + env(safe-area-inset-bottom))}
    #meters{grid-template-columns:auto 40px;font-size:10px;padding:6px 9px;flex:none}
    #leftTop{min-width:0;flex:1}#leftTop .pill{max-width:100%}.status{max-width:none;min-width:0}
    #hint{bottom:calc(250px + env(safe-area-inset-bottom));white-space:normal;text-align:center;width:80vw}
    #toast{top:auto;bottom:calc(250px + env(safe-area-inset-bottom))}
    #chatwrap{bottom:max(8px,env(safe-area-inset-bottom))}
    .entry{font-size:15px}
    .post img,.post .pic{max-height:min(30vh,280px)}
  }
  @media (orientation:landscape) and (max-height:520px){
    #top{top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right))}
    #meters,#sky,#hint{display:none}
    .pill{padding:6px 11px;font-size:13px}
    #panel{left:auto;right:max(8px,env(safe-area-inset-right));top:8px;bottom:8px;width:min(46vw,440px);height:auto;max-height:none;border-radius:20px}
    #panel.hidden{transform:translateX(120%)}
    #chatwrap{left:max(10px,env(safe-area-inset-left));transform:none;width:min(46vw,460px);bottom:max(8px,env(safe-area-inset-bottom))}
    #mini{width:76px;height:76px;left:max(10px,env(safe-area-inset-left));bottom:66px}
    #diaryBtn{top:auto;bottom:max(10px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right))}
    #camctl{right:max(10px,env(safe-area-inset-right));bottom:60px}
    body.panelOpen #camctl{right:calc(min(46vw,440px) + 22px)}
    #toast{top:10px;bottom:auto}
  }
  /* ---- cleaner controls ---- */
  #meters{display:none!important}body.showMeters #meters{display:grid!important}
  #mochaPill{cursor:pointer}
  #panel{top:calc(70px + env(safe-area-inset-top));bottom:calc(86px + env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));width:min(400px,42vw);max-height:none;transition:transform .35s,opacity .35s,width .3s}
  #panel.wide{width:min(720px,72vw)}
  #dock{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end;z-index:4}
  .round{border:0;width:50px;height:50px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.16);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  body.panelOpen #dock{right:calc(min(400px,42vw) + 24px + env(safe-area-inset-right))}
  body.panelOpen.wideP #dock{right:calc(min(720px,72vw) + 24px)}
  #joyOld{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:calc(90px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:rgba(255,250,242,.28);border:2px solid rgba(255,250,242,.7);display:none;touch-action:none;z-index:4;backdrop-filter:blur(2px)}
  #knobOld{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.2);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:22px}
  #near{position:fixed;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;font-size:13px;z-index:3;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
  #mapWrap{position:fixed;inset:0;background:rgba(20,26,40,.55);display:flex;align-items:center;justify-content:center;z-index:8;padding:16px}
  #mapWrap.hidden{display:none}
  .mapCard{background:var(--paper);border-radius:22px;padding:12px;box-shadow:0 8px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;max-width:100%}
  .mapCard header{display:flex;align-items:center;gap:10px}.mapCard header b{font-size:16px}.mapCard header .muted{flex:1}
  #bigmap{width:min(86vw,74vh,620px);height:min(86vw,74vh,620px);border-radius:16px;cursor:crosshair;touch-action:none;align-self:center}
  .legend{font-size:12px;color:var(--mut);font-weight:700;text-align:center}
  @media (min-width:761px){body.panelOpen #hint{left:calc((100vw - min(400px,42vw) - 24px)/2);white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - min(400px,42vw) - 230px)}body.panelOpen #chatwrap{left:calc((100vw - min(400px,42vw) - 24px)/2);width:min(520px,calc(100vw - min(400px,42vw) - 60px))}body.panelOpen.wideP #chatwrap{left:calc((100vw - min(720px,72vw) - 24px)/2);width:min(520px,calc(100vw - min(720px,72vw) - 60px))}}
  @media (max-width:760px){#near{top:calc(108px + env(safe-area-inset-top))}}
  @media (max-width:760px){
    #panel{top:auto;width:auto;right:0}
    body.panelOpen #dock,body.panelOpen #joy{display:none!important}
    #dock{bottom:calc(84px + env(safe-area-inset-bottom))}
  }
  @media (orientation:landscape) and (max-height:520px){
    #panel{top:8px;bottom:8px;width:min(46vw,440px)}
    body.panelOpen #dock{right:calc(min(46vw,440px) + 22px)}
    #dock{bottom:max(10px,env(safe-area-inset-bottom));flex-direction:row-reverse}
    #near{top:calc(54px + env(safe-area-inset-top))}body.panelOpen #near,body.msgOpen #near{left:calc((100vw - min(46vw,440px) - 22px)/2);max-width:calc(100vw - min(46vw,440px) - 40px)}
    #expandPanel{display:none}
    #panel.wide{width:min(46vw,440px)}
    body.panelOpen.wideP #dock{right:calc(min(46vw,440px) + 22px)}
    body.panelOpen.wideP #chatwrap{left:max(10px,env(safe-area-inset-left));width:calc(100vw - min(46vw,440px) - 84px)}
  }
  /* ---- game controller (walk mode) ---- */
  .stick{position:fixed;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,242,.18),rgba(255,250,242,.32));border:2.5px solid rgba(255,250,242,.8);display:none;touch-action:none;z-index:4;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .stick .nub{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.22);transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;font-size:22px;pointer-events:none}
  .stick .lab{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none}
  .stick.live{opacity:1!important}
  body.walk .stick{display:block}
  #joy{left:max(26px,env(safe-area-inset-left));bottom:calc(46px + env(safe-area-inset-bottom));opacity:.75;transition:opacity .2s}
  #joy.float{transition:none}
  #look{right:max(26px,env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom));opacity:.75}
  body.walk #chatwrap{display:none}body.walk.chatOpen #chatwrap{display:block;bottom:calc(196px + env(safe-area-inset-bottom))}
  #chatBtn{display:none}body.walk #chatBtn{display:flex}
  body.walk #dock{bottom:calc(214px + env(safe-area-inset-bottom))}
  body.walk.chatOpen #dock{bottom:calc(270px + env(safe-area-inset-bottom))}
  body.walk #hint{display:none}
  body.walk.panelOpen .stick{display:none}
  @media (max-width:760px){#joy,#look{width:124px;height:124px}}
  @media (orientation:landscape) and (max-height:520px){
    .stick{width:112px;height:112px}.stick .nub{width:50px;height:50px}
    #joy{bottom:max(24px,env(safe-area-inset-bottom))}#look{bottom:max(24px,env(safe-area-inset-bottom))}
    body.walk #dock{bottom:auto;top:max(8px,env(safe-area-inset-top));flex-direction:column;gap:8px}body.walk #dock .round{width:46px;height:46px;font-size:20px}body.walk.showMeters #meters{display:none!important}
    body.walk.chatOpen #chatwrap{bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(46vw,420px)}
  }
  html:not(.touch) body.walk .stick{display:none}html:not(.touch) body.walk #chatwrap{display:block}html:not(.touch) #chatBtn{display:none!important}html:not(.touch) body.walk #dock{bottom:calc(86px + env(safe-area-inset-bottom))}
  /* ---- paintings grid + picture viewer (lightbox) ---- */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:12px 9px;margin:6px 0 2px}
  .pcard{border:0;background:none;padding:0;font:inherit;text-align:left;cursor:zoom-in;color:var(--mut);font-size:11px;font-weight:700;min-width:0;line-height:1.3}
  .pcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#f6efe2;border:4px solid #b08a3a;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.12)}

  phones:['The first handheld cell phone call was made in 1973 by Martin Cooper of Motorola, on a street in New York City.','That first cell phone weighed about 2.5 pounds, and phones like it got the nickname "the brick."','The first text message was sent in 1992. It said "Merry Christmas."','Cell phones are called "cell" phones because the land is split into areas called cells, each with its own antenna tower.','Most phone touchscreens work by sensing how your fingertip changes a tiny electric field on the glass, which is why they often ignore regular gloves.','The word "emoji" comes from Japanese: "e" means picture and "moji" means character.'],
  bicycles:['One of the first bicycles, the "running machine" Karl Drais invented in 1817, had no pedals at all. Riders pushed along with their feet.','Old "penny-farthing" bikes had a giant front wheel because the pedals were attached right to it, so a bigger wheel went farther with each turn.','The Tour de France bike race started in 1903.','A bike helmet has a layer of foam inside that crushes to soak up a bump, so your head doesn\'t have to.','Seattle\'s Burke-Gilman Trail is a bike path built along an old railroad line.','Riding a bicycle is one of the most energy-efficient ways for a person to travel.'],

 rain:['Seattle actually gets less rain per year than New York City — it just drizzles on more days.','Seattle\'s cloudiest stretch is usually from October through April.','A lot of Seattle rain is light drizzle rather than big storms.'],
 coffee:['Coffee beans are really the seeds of a cherry-like fruit.','Espresso is made by forcing hot water through finely ground coffee under pressure.','A latte is espresso with lots of steamed milk and a thin layer of foam.'],

 stars:['The Sun is a star, just a very close one.','Light from some stars left them thousands of years ago.','Stars twinkle because their light gets wiggled by Earth\'s air.'],
 ferries:['Washington State Ferries is one of the biggest ferry systems in the United States.','Many of the ferries carry cars, bikes and people across Puget Sound.','Riding the ferry is one of the best ways to see the Seattle skyline.'],
 bread:['Bread rises because yeast eats sugar and makes tiny gas bubbles.','Sourdough uses a "starter" of wild yeast that bakers can keep alive for years.','Kneading dough builds gluten, which makes bread chewy.'],
 records:['Vinyl records store sound as tiny wiggly grooves.','A needle riding in the groove turns those wiggles back into sound.','Seattle is famous for the grunge music scene of the early 1990s.'],
 watercolor:['Watercolor gets lighter the more water you add.','Mixing blue and yellow makes green.','Painters often paint the same view at different times of day to catch the light.'],
 birds:['Crows are very smart and can remember human faces.','Great blue herons stand perfectly still to catch fish.','Bald eagles live around Puget Sound all year.'],
 ferns:['Ferns are older than the dinosaurs.','Moss loves damp, shady places — which is why it grows all over Seattle.','Plants make food from sunlight through photosynthesis.'],
 volcanoes:['Washington has several volcanoes, including Mount Rainier, Mount St. Helens and Mount Baker.','Mount St. Helens erupted in 1980.','Volcanic soil can be very good for growing plants.'],
 poetry:['A haiku has three lines of 5, 7 and 5 syllables.','Poems don\'t have to rhyme.','A limerick is a funny five-line poem.'],
 ghosts:['The word "ghost" comes from an old English word, "gāst," meaning spirit or breath.','Many cultures have festivals to remember loved ones, like Día de los Muertos.','Lots of old lighthouses have ghost stories.'],
 bats:['Bats are the only mammals that can truly fly.','Many bats find their way in the dark using echolocation.','Some bats eat so many insects that they help protect farmers\' crops.'],
 poodles:['Poodles come in three sizes: standard, miniature and toy.','Poodles were first bred to fetch things from water.','Poodles are known for being very smart and easy to train.'],
 hedgehogs:['Hedgehogs roll into a spiky ball when they feel scared.','A hedgehog has thousands of spines called quills.','Hedgehogs are mostly active at night.'],
 'gothic architecture':['Gothic buildings often have pointed arches, tall spires and big stained-glass windows.','Gothic architecture began in France in the 1100s.','Victorian "Gothic Revival" houses in the 1800s borrowed those pointy shapes for homes.'],
 'film history':['The Lumière brothers held some of the first public film screenings in Paris in 1895.','Early movies were silent, so musicians often played live music in the theater.','"The Jazz Singer" (1927) was the first feature-length film with synchronized talking scenes.'],
 'arcade games':['"Pong" (1972) was one of the first big arcade hits.','"Pac-Man" came out in 1980.','High-score tables let players compete by adding their initials.'],
 'vintage fashion':['Clothes are often called "vintage" when they are at least 20 years old.','Thrift shopping gives clothes a second life and keeps them out of landfills.','Many 1970s styles, like bell-bottoms, have come back into fashion more than once.'],
 libraries:['The Library of Congress in Washington, D.C. is one of the largest libraries in the world.','Seattle\'s glass-and-steel Central Library opened in 2004.','Many libraries lend more than books — tools, instruments, even seeds.'],
 groceries:['Bananas are technically berries, but strawberries are not.','Sealed honey can last for a very long time because it is low in water and acidic.','Washington grows more apples than any other U.S. state.'],
  woodworking:['Western redcedar is naturally rot-resistant, which is why it is used for shingles and canoes.','Wood swells and shrinks much more across the grain than along it, so woodworkers leave room for it to move.','Douglas fir is one of the strongest softwoods, so it is a favorite for beams and framing.','Most trees in cool climates add one growth ring a year, so counting rings can tell a tree\'s age.'],
  wool:['Jacob sheep can grow two, four or even six horns.','Wool fibers are naturally crimped, and the crimp traps warm air between them.','Lanolin is a natural wax in sheep\'s wool that helps it shed rain.','Knitting turns one long strand of yarn into fabric by pulling loops through loops.'],
  'nw plants':['Sword ferns stay green all winter.','Washington\'s state tree is the western hemlock.','Salal is a native Northwest shrub, and Indigenous peoples of the coast have long eaten its dark berries.','Pacific madrone trees peel their reddish bark in thin curls.'],
  baking:['The marionberry is a blackberry cultivar developed at Oregon State University.','Baking soda needs an acid, like buttermilk, to make bubbles; baking powder already has its acid mixed in.','Croissant dough is folded again and again, so thin layers of butter puff it into flaky sheets.','Resting bread dough in the fridge slows the yeast down and gives it more flavor.'],
  moths:['Luna moth adults have no mouths and live about a week.','Moths and butterflies belong to the same insect order, Lepidoptera, which means "scale wings."','Many male moths use their feathery antennae to smell a female from far away.','There are many more kinds of moths than butterflies.'],

 leavenworth:['Leavenworth is a small town in the Cascade Mountains built to look like a Bavarian village from the Alps.','Leavenworth had a hard time after the railroad and lumber jobs left, so in the 1960s the town redid its buildings in a Bavarian style, and visitors came.','Leavenworth has a museum with thousands of nutcrackers from all over the world.','The Wenatchee River flows right past Leavenworth.','Every December, the whole village of Leavenworth is covered in Christmas lights.'],

function tripVia(id){return TRIPS[id]&&TRIPS[id].by==='ferry'?'ferry':'train'}

function tripPlan(id,t0,chk){const T=TRIPS[id];if(!T)return null;const h0=hourAt(t0),bed=sched().bed,ride=(chk?T.ride[0]:rand(T.ride[0],T.ride[1]))*60e3,dur=Math.max((chk?T.hrs[0]:rand(T.hrs[0],T.hrs[1]))*3600e3,2*ride+20*60e3),endH=h0+dur/3600e3,late=Math.min(bed-.5,T.by==='ferry'?21.5:22.6);

  const bedT=t0+((((bed%24)-h0)+24)%24)*3600e3;if(bedT-t0<ride+1.2*3600e3)return null;const wakeT=bedT+secondsToWake(bedT)*1000+60e3;
  return{back:wakeT+Math.max((chk?1.2:rand(1.2,2.6))*3600e3,ride+20*60e3),over:1,ride,bedT,wakeT}}

  if(!tripPlan(id,at,1)||!tripPlan(id,at+15*60e3,1))return T.by==='ferry'?'no ferry gets him there and back before bed':'no train gets him there and back before bed';return''}

function tripCand(at){if(S.trip)return null;const ids=Object.keys(TRIPS).filter(id=>!tripOk(id,at));if(!ids.length)return null;
  const mo=new Date(at).getMonth(),tr=S.traits,vis=id=>(S.trips||[]).filter(x=>x.id===id).length;
  const w=ids.map(id=>{const T=TRIPS[id];let v=1+(vis(id)?0:1.4)-Math.min(1.2,vis(id)*.4)+T.tags.reduce((a,k)=>a+Math.max(-1,S.interests[k]||0)*.12,0);if(id==='leavenworth'&&mo===11)v+=2.2;if(T.night&&tr.adventure>.6)v+=.4;if(T.cost>S.coins*.6)v-=.6;return Math.max(.1,v)});
  let r=Math.random()*w.reduce((a,b)=>a+b,0),id=ids[0];for(let i=0;i<ids.length;i++){r-=w[i];if(r<=0){id=ids[i];break}}
  const d=new Date(at),wk=d.getDay()===0||d.getDay()===6,big=holsOn(at).some(h=>h.big),want=nextWant(),saving=!S.phone&&want&&S.coins-TRIPS[id].cost<want.price;

// start a trip (he's at the platform / on the ferry). Pays for the ticket and lays out the trip's moments.
function tripBegin(id,t0=Date.now(),live=true){const T=TRIPS[id];if(!T||S.trip||S.coins<T.cost)return null;if(!live&&T.by==='train')t0=nextTrain(t0)+25e3;const pl=tripPlan(id,t0)||tripPlan(id,t0,1);if(!pl)return null;
