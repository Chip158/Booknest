<!DOCTYPE html>
<html lang="en">
<head>

<style>
  :root{--ink:#26324a;--paper:#fffaf2;--accent:#e9886b;--teal:#3f8f8a;--line:#ece4d8;--soft:#f3efe8;--mut:#9a958c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  .set small{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:2px}

  @media (orientation:landscape) and (max-height:520px){

    #mini{width:76px;height:76px;left:max(10px,env(safe-area-inset-left));bottom:66px}
    #diaryBtn{top:auto;bottom:max(10px,env(safe-area-inset-bottom));right:max(10px,env(safe-area-inset-right))}

  /* ---- cleaner controls ---- */
  #meters{display:none!important}body.showMeters #meters{display:grid!important}
  #mochaPill{cursor:pointer}
  #panel{top:calc(70px + env(safe-area-inset-top));bottom:calc(86px + env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));width:min(400px,42vw);max-height:none;transition:transform .35s,opacity .35s,width .3s}

  .round{border:0;width:50px;height:50px;border-radius:50%;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.16);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

  /* ---- game controller (walk mode) ---- */
  .stick{position:fixed;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,242,.18),rgba(255,250,242,.32));border:2.5px solid rgba(255,250,242,.8);display:none;touch-action:none;z-index:4;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
