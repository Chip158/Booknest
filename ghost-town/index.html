<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mocha's Ghost Town</title>
<style>
  :root{--ink:#2a2547;--paper:#fffaf3;--lav:#b9a7ff;--line:#e9e1f7;--mocha:#8b5a3c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#3d3f7e;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);touch-action:none}
  canvas#c{position:fixed;inset:0;display:block;cursor:grab}
  .pill{white-space:nowrap;background:var(--paper);border-radius:999px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.18);display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
  #top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}
  #top>*{pointer-events:auto}
  .status{background:#efe9ff;color:#6a55c9;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvl{background:var(--mocha);color:#fff;border-radius:999px;padding:2px 8px;font-size:11px}
  #meters{background:var(--paper);border-radius:16px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18);font-size:11px;font-weight:700;display:grid;grid-template-columns:auto 70px;gap:4px 8px;align-items:center}
  .bar{height:7px;border-radius:9px;background:#eee8f8;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .6s}
  #panel{position:fixed;top:170px;right:12px;width:350px;max-height:calc(100% - 260px);background:var(--paper);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;transition:transform .35s,opacity .35s}
  #panel.hidden{transform:translateX(120%);opacity:0;pointer-events:none}
  #panel header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
  #panel header b{font-size:16px}
  .x{border:0;background:#efe9ff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink)}
  nav{display:flex;gap:4px;padding:4px 12px 10px}
  nav button{border:0;border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;background:transparent;color:#8a82a8;cursor:pointer}
  nav button.on{background:var(--ink);color:#fff}
  .tab{overflow-y:auto;padding:0 16px 16px;display:none}.tab.on{display:block}
  .entry{border-top:1.5px dashed var(--line);padding:11px 0;font-size:14px;line-height:1.45;animation:pop .5s}
  .entry .meta{display:flex;justify-content:space-between;font-size:11px;color:#a49cc0;margin-bottom:4px;font-weight:700}
  .tag{border:1.5px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:#7b6fb0}
  .tag.big{border-color:#f3c9a8;color:var(--mocha);background:#fff1e6}
  @keyframes pop{from{opacity:0;transform:translateY(-6px)}}
  h4{margin:14px 0 6px;font-size:13px;color:#7b6fb0}
  .chip{display:inline-block;background:#f3eefe;border-radius:999px;padding:4px 10px;margin:3px 4px 3px 0;font-size:13px}
  .muted{color:#a49cc0;font-size:13px}
  .skill{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
  .skill small{color:#a49cc0;font-weight:700;text-align:right}
  .goal{background:#fff1e6;border-radius:14px;padding:10px 12px;font-size:14px}
  #diaryBtn{position:fixed;top:170px;right:12px;display:none}
  #panel.hidden~#diaryBtn{display:inline-flex}
  button.pill{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px}
  #mini{position:fixed;left:12px;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));width:120px;height:120px;border-radius:50%;background:var(--paper);box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
  #chatwrap{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(520px,calc(100% - 24px))}
  #chatlog{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;align-items:flex-end;pointer-events:none}
  .msg{background:var(--ink);color:#fff;border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:14px;max-width:80%;transition:opacity 1s}
  form#chat{display:flex;gap:8px;background:var(--paper);border-radius:999px;padding:6px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
  form#chat input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;padding:6px 10px;outline:none;color:var(--ink);min-width:0}
  form#chat button{border:0;background:var(--lav);color:var(--ink);font:inherit;font-weight:800;border-radius:999px;padding:8px 16px;cursor:pointer}
  #bubble{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:var(--paper);border-radius:16px;padding:8px 12px;font-size:14px;max-width:240px;box-shadow:0 4px 0 rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .3s;text-align:center;line-height:1.35;z-index:3}
  #bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
  #bubble.show{opacity:1}
  #bubble.think{font-style:italic;color:#6a55c9}
  .lbl{position:fixed;left:0;top:0;transform:translate(-50%,-100%);background:rgba(255,250,243,.93);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:opacity .3s}
  .lbl.new{background:#fff1e6;color:var(--mocha)}
  #toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--mocha);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;opacity:0;transition:.4s;pointer-events:none;white-space:nowrap;z-index:4;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .opts button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .opts button.on{border-color:var(--ink);background:#f3eefe}
  .danger{border:0;background:#ffe3ea;color:#b2365c;font:inherit;font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;margin-top:14px}
  #hint{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-size:12px;font-weight:700;opacity:.8;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4);transition:opacity 1s;white-space:nowrap}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:16px;text-align:center;padding:30px}
  @media (max-width:760px){
    #panel{left:8px;right:8px;width:auto;top:auto;bottom:calc(76px + env(safe-area-inset-bottom));max-height:55%}
    #panel.hidden{transform:translateY(120%)}
    #diaryBtn{top:auto;bottom:calc(150px + env(safe-area-inset-bottom));right:12px}
    #mini{width:90px;height:90px;bottom:calc(150px + env(safe-area-inset-bottom))}
    #meters{grid-template-columns:auto 46px;font-size:10px;padding:6px 10px}
    #hint{bottom:calc(250px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="err">Mocha's town needs WebGL to load 👻</div>

<div id="top">
  <div class="pill">👻 Mocha <span class="lvl" id="lvl">lv 1</span><span class="status" id="status">floating</span></div>
  <div id="meters"></div>
</div>
<div id="toast"></div>

<aside id="panel">
  <header><b>Mocha's diary</b><button class="x" id="closePanel" aria-label="close">×</button></header>
  <nav>
    <button data-tab="diary" class="on">his diary</button>
    <button data-tab="grow">growing</button>
    <button data-tab="about">about you</button>
  </nav>
  <div class="tab on" id="tab-diary"></div>
  <div class="tab" id="tab-grow"></div>
  <div class="tab" id="tab-about"></div>
</aside>
<button class="pill" id="diaryBtn">📖 diary</button>

<canvas id="mini" width="240" height="240" title="map"></canvas>
<div id="hint">drag to look around · tap to call Mocha</div>

<div id="chatwrap">
  <div id="chatlog"></div>
  <form id="chat" autocomplete="off"><input id="say" maxlength="160" placeholder="say something to Mocha…"><button>send</button></form>
</div>
<div id="bubble"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
if(!window.THREE){document.getElementById('err').style.display='flex';return}
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=seeded(2026);const rpick=a=>a[Math.floor(R()*a.length)];

// =============== WORLD DATA ===============
const SKILLS={reading:'📚 Reading',music:'🎵 Music',frog:'🐸 Frog-speak',nose:'🥐 Baking nose',story:'🎬 Storytelling',dream:'💤 Dreaming',stars:'✨ Stargazing',garden:'🌱 Gardening',explore:'🧭 Exploring',socks:'🧦 Sock wisdom'};
const PLACES=[
 {id:'bakery', name:'Crumb & Moon Bakery', x:-42,z:-30,w:14,h:9,d:10,wall:'#f6bccb',roof:'#c45f80',need:'snack',skill:'nose',tag:'Food',keys:['bakery','bake','bread','cake','pastry','cookie','bun','croissant']},
 {id:'library',name:'Whisper Library',     x:22,z:-44,w:20,h:12,d:12,wall:'#a9bdec',roof:'#4d5bab',need:'curious',skill:'reading',tag:'Hobby',keys:['library','book','read']},
 {id:'tower',  name:'Clocktower Attic',    x:58,z:-24,w:8,h:28,d:8,wall:'#cdbdea',roof:'#5a4991',need:'energy',skill:'dream',tag:'Nap',keys:['tower','clock','attic']},
 {id:'cinema', name:'Old Lantern Cinema',  x:54,z:26,w:18,h:11,d:12,wall:'#f3d683',roof:'#b2583f',need:'curious',skill:'story',tag:'Visited',keys:['cinema','movie','film','theater','theatre']},
 {id:'music',  name:'Hum & Strum Records', x:-54,z:14,w:13,h:8,d:10,wall:'#ace3cd',roof:'#3e8e78',need:'social',skill:'music',tag:'Hobby',keys:['music','record','song','vinyl','guitar','dance']},
 {id:'museum', name:'Museum of Lost Socks',x:-8,z:50,w:22,h:12,d:14,wall:'#ebe6f8',roof:'#7a6bb8',need:'curious',skill:'socks',tag:'Visited',keys:['museum','sock','art']},
 {id:'pond',     name:'Moonlit Pond',  x:40,z:64,spot:1,need:'social',skill:'frog',tag:'Friends',keys:['pond','frog','water','lake','swim']},
 {id:'graveyard',name:'Cozy Graveyard',x:-62,z:62,spot:1,need:'energy',skill:'dream',tag:'Nap',keys:['grave','cemetery','graveyard','neighbo']},
 {id:'patch',    name:'Pumpkin Patch', x:84,z:66,spot:1,need:'snack',skill:'garden',tag:'Food',keys:['pumpkin','patch','halloween']},
 {id:'plaza',    name:'Fountain Plaza',x:0,z:0,spot:1,need:'social',skill:'music',tag:'Friends',keys:['plaza','fountain','center','square']},
 // secret places Mocha has to discover by exploring
 {id:'greenhouse', name:'Forgotten Greenhouse',x:-100,z:-62,w:13,h:7,d:10,wall:'#bff0dc',roof:'#57b394',need:'curious',skill:'garden',tag:'Discovery',hidden:1,keys:['greenhouse','plant','garden','flower']},
 {id:'observatory',name:'Hilltop Observatory', x:4,z:-100,w:12,h:10,d:12,wall:'#d8d0f5',roof:'#3b3170',need:'energy',skill:'stars',tag:'Discovery',hidden:1,dome:1,keys:['observatory','star','telescope','sky','moon']},
 {id:'lighthouse', name:'Little Lighthouse',  x:108,z:-70,w:7,h:24,d:7,wall:'#fff3f3',roof:'#d4566b',need:'curious',skill:'stars',tag:'Discovery',hidden:1,round:1,keys:['lighthouse','sea','ocean']},
 {id:'carousel',   name:'Sleepy Carousel',    x:-104,z:100,spot:1,need:'social',skill:'music',tag:'Discovery',hidden:1,keys:['carousel','horse','ride']},
];
const byId=Object.fromEntries(PLACES.map(p=>[p.id,p]));
PLACES.forEach(p=>{
  p.ry=Math.atan2(-p.x,-p.z);
  if(p.id==='plaza'){p.dx=0;p.dz=9}
  else if(p.spot){const l=Math.hypot(p.x,p.z),o=p.id==='pond'?13:p.id==='carousel'?9:4;p.dx=p.x-p.x/l*o;p.dz=p.z-p.z/l*o}
  else{const off=p.d/2+3.5;p.dx=p.x+Math.sin(p.ry)*off;p.dz=p.z+Math.cos(p.ry)*off}
  p.r=p.spot?8:Math.max(p.w,p.d)/2+1.5;
});
const ITEMS={bakery:['a crumb shaped like a moon','a paper cupcake liner'],library:['a bookmark from 1987','a flower pressed in a book'],tower:['a tiny brass gear','a feather from the clock owl'],cinema:['a ticket stub','one perfect popcorn kernel'],music:['a guitar pick','a record chip that still hums'],museum:['a lonely striped sock','an argyle button'],pond:['a smooth skipping stone','a dried lily pad'],graveyard:['an old brass key','a marigold'],patch:['a pumpkin seed','a twisty vine curl'],plaza:['a wishing coin','a lost mitten'],greenhouse:['a seed packet labeled ???','a glowing mushroom'],observatory:['a star chart','a tiny meteor pebble'],lighthouse:['a sea-glass marble','a map with an X on it'],carousel:['a painted horse ribbon','a brass ring']};

const F={pastry:['cinnamon bun','pumpkin scone','moon cookie','cocoa croissant','maple twist','mocha éclair (my namesake!)'],book:['"Haunting for Beginners"','"The Very Quiet Owl"','"Soup: A History"','"Moon Phases & You"','"Knitting with Fog"','a mystery where the butler was a ghost'],movie:['a black-and-white romance','a documentary about clouds','a very scary movie (I was the scariest thing there)','a cartoon about a lost mitten'],song:['"Fly Me to the Moon"','a lullaby in a minor key','lo-fi rain beats','an accordion waltz'],frog:['Ribbert','Lady Croaksworth','Toad (who is a frog)','Lil Puddle'],flower:['dandelion','marigold','tiny pinecone','very nice leaf'],star:['the Teacup','the Sleepy Cat','Big Spoon','the Wobbly Hat']};
const fill=s=>s.replace(/\{(\w+)\}/g,(_,k)=>k==='n'?Math.floor(rand(3,13)):k==='user'?(S.mem.userName||'my visitor'):pick(F[k]||['?']));
// diary lines: [beginner lines, skilled lines (skill lv>=4)]
const LINES={
 bakery:[['Floated through the wall of Crumb & Moon and sniffed a {pastry}. Ghosts can\'t eat, but we can sniff very hard.','Tried to pick up a {pastry}. My hand went right through it. Ate the vibes instead. 9/10.','Got flour all over myself and for once nobody could tell.'],['My nose is getting good. I can tell a {pastry} from a {pastry} with my eyes closed now.','Helped the baker by blowing on the oven window so it wouldn\'t fog. She left a {pastry} out "for the draft."']],
 library:[['Read {book} over someone\'s shoulder. They turned the page too fast.','Tried to turn a page myself. It took 20 minutes. Worth it.','Shushed a moth. It shushed me back.'],['Read all of {book} by myself! I can turn pages with a little breeze now.','Rearranged the poetry shelf by vibe. The librarian says it\'s "weirdly better."']],
 tower:[['Napped in the clocktower attic. The ticking is like a heartbeat I don\'t have.','Curled up between the big gears. Very punctual nap.'],['Had a dream I was a cloud. Then I had a dream I was a ghost dreaming about a cloud. Deep.','I can nap through the midnight bells now. Professional napper.']],
 cinema:[['Watched {movie} from the back row. Cried a little. Ghost tears are just mist.','Sat in the projector beam and did a shadow puppet show. Two people clapped.'],['Watched {movie} and guessed the ending. I\'m getting good at stories.','Made up my own movie in my head about a ghost who learns to bake. 5 stars.']],
 music:[['Spun a record at Hum & Strum. It was {song}. Did a little float-dance.','Tried every instrument in the shop. The tuba and I understand each other.'],['Hummed {song} all the way through without forgetting the words!','The shop cat and I did a duet. She did the high parts.']],
 museum:[['Visited the Museum of Lost Socks. Found a stripy one that looked lonely. Same, buddy.','Stood very still next to a statue for {n} minutes. A kid waved at me. I waved back.'],['I can tell which sock goes with which just by looking now. Reunited {n} pairs. They don\'t know it was me.','Gave a ghost tour of the Argyle wing. Audience: one moth. Great listener.']],
 pond:[['Hung out with the frogs. {frog} told me a joke. I didn\'t get it but laughed anyway.','Looked for my reflection in the pond. Ghosts don\'t have one. Saw the moon though.'],['I understood a whole frog sentence today! {frog} said "ribbit" which I now know means "nice weather."','The frogs saved me a lily pad. I\'m basically in the frog club now.']],
 graveyard:[['Visited the old neighbors at the graveyard. Everyone was sleeping in. Classic.','Napped behind the gravestone that says BRB. Felt seen.'],['Left a {flower} on Mr. Hollow\'s stone. Told him about my week.','Dreamt the gravestones were dominoes. Woke up giggling.']],
 patch:[['Picked the roundest pumpkin in the patch and told it a secret.','Smelled {n} pumpkins. All of them smelled like pumpkin. Science!'],['Gave a sad little vine a pep talk. It grew an inch overnight. Coincidence? No.','I think the pumpkins grow faster when I hum. I\'m going to keep testing this.']],
 plaza:[['Floated around the fountain {n} times. Got dizzy. Worth it.','Someone tossed a coin in the fountain. I made the wish for them.'],['People-watched at the plaza. A dog saw me. Dogs always see me. We\'re friends now.','Made the fountain spray into a heart shape for one second. Nobody saw. I saw.']],
 greenhouse:[['Found glass walls full of overgrown plants. Everything\'s humming a little. I think they like me.','Watered a fern with fog. It perked right up.'],['The plants lean toward me when I float by. I think I\'m their sun now. A very cold sun.']],
 observatory:[['Peeked through the big telescope. Found a constellation I\'m calling {star}.','Counted stars until I lost count. Started over. Lost count again.'],['Mapped {star} and {star} tonight. My star chart is getting serious.']],
 lighthouse:[['Floated to the top of the little lighthouse. The light went round and round and so did I.','Waved at a boat. The boat flashed its light back. Friends?'],['I\'m the lighthouse\'s night shift now. Nobody asked me to. I just am.']],
 carousel:[['Found an old carousel that only turns when nobody\'s looking. So I looked away. It turned!','Rode the painted horse with the ribbon mane. Three laps.'],['The carousel plays music for me now. Just for me.']],
};
const DOING={bakery:'sniffing pastries',library:'reading',tower:'napping',cinema:'at the movies',music:'listening to records',museum:'looking at socks',pond:'with the frogs',graveyard:'visiting neighbors',patch:'in the pumpkins',plaza:'by the fountain',greenhouse:'in the greenhouse',observatory:'stargazing',lighthouse:'at the lighthouse',carousel:'on the carousel'};
const SAYS={bakery:['mmm… cinnamon','*sniff sniff*'],library:['shhh… reading','ooh, a new book'],tower:['so sleepy…','zzz'],cinema:['the movie\'s starting!','popcorn smell…'],music:['♪ la la la ♪','this one\'s a bop'],museum:['so many socks','very cultural'],pond:['ribbit!','hi frogs!'],graveyard:['morning, neighbors','shh, they\'re sleeping'],patch:['so many pumpkins!','this one\'s the roundest'],plaza:['wheee','fountain time'],greenhouse:['hello plants','so green…'],observatory:['look at all those stars','twinkle twinkle'],lighthouse:['round and round','hi boats!'],carousel:['wheee!','giddy-up'],explore:['what\'s over here…?','ooh, I wonder what\'s past the trees','exploring time 🧭']};
const GOALS=[
 {id:'read',text:'read 4 books',place:['library'],n:4},
 {id:'frogs',text:'learn all the frogs\' names',place:['pond'],n:4},
 {id:'naps',text:'take 3 really good naps',place:['tower','graveyard'],n:3},
 {id:'movies',text:'watch 3 movies',place:['cinema'],n:3},
 {id:'song',text:'learn a whole song',place:['music','plaza'],n:4},
 {id:'treasure',text:'find 2 new treasures',type:'item',n:2},
 {id:'secret',text:'discover a secret place',type:'discover',n:1},
 {id:'pumpkin',text:'grow the biggest pumpkin',place:['patch','greenhouse'],n:3},
 {id:'socks',text:'reunite lost socks',place:['museum'],n:3},
 {id:'friend',text:'chat with you 5 times',type:'chat',n:5},
];

// =============== STATE ===============
const KEY='mocha-ghost-v1';
function fresh(){return{needs:{snack:70,energy:80,social:60,curious:75},xp:{},aff:{},visits:{},items:[],goal:null,goalsDone:0,discovered:[],words:[],taught:{},diary:[],mem:{userName:null,likes:[],favs:{},chats:0,met:Date.now()},hat:'scarf',born:Date.now(),lastSeen:Date.now(),lastThought:0}}
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const isNew=!S||!S.mem;if(isNew)S=fresh();
function save(){S.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
setInterval(save,5000);addEventListener('beforeunload',save);
const totalXP=()=>Object.values(S.xp).reduce((a,b)=>a+b,0);
const level=()=>Math.floor(Math.sqrt(totalXP()/18))+1;
const skillLv=k=>Math.min(10,Math.floor((S.xp[k]||0)/30)+1);
const known=p=>!p.hidden||S.discovered.includes(p.id);
const favorite=()=>{const e=Object.entries(S.aff).filter(([k])=>byId[k]).sort((a,b)=>b[1]-a[1]);return e.length&&e[0][1]>4?byId[e[0][0]]:null};
const ageDays=()=>Math.floor((Date.now()-S.born)/864e5);
const growScale=()=>Math.min(2.3,1.55+level()*.06);

// =============== DIARY / BRAIN ===============
let onDiary=()=>{},liveToast=()=>{},liveLabel=()=>{};
function addEntry(tag,text,place,t=Date.now(),big){S.diary.unshift({t,tag,text,place,big:!!big});S.diary.length=Math.min(S.diary.length,250);onDiary()}
function newGoal(){const done=S.goal&&S.goal.id;const pool=GOALS.filter(g=>g.id!==done&&!(g.type==='discover'&&PLACES.every(known)));const g=pick(pool);S.goal={id:g.id,count:0};return g}

function doVisit(p,t=Date.now(),live=true){
  const lvBefore=level(),skBefore=skillLv(p.skill);
  S.xp[p.skill]=(S.xp[p.skill]||0)+Math.round(rand(8,14));
  S.aff[p.id]=(S.aff[p.id]||0)+rand(-0.5,2.5)+(S.mem.likes.some(l=>p.keys.some(k=>l.includes(k)))?1.5:0);
  S.visits[p.id]=(S.visits[p.id]||0)+1;
  S.needs[p.need]=clamp(S.needs[p.need]+45,0,100);
  const tier=skillLv(p.skill)>=4&&Math.random()<.65?1:0;
  let text=fill(pick(LINES[p.id][tier]));
  if(S.visits[p.id]>3&&Math.random()<.2)text=`Back at ${p.name} again (visit #${S.visits[p.id]}). `+text;
  if(S.words.length&&Math.random()<.18)text+=` It was all very ${pick(S.words)}, as ${S.mem.userName||'my visitor'} would say.`;
  addEntry(p.tag,text,p.name,t);
  bumpGoal('visit',p.id,t,live);
  if(Math.random()<.22){const it=ITEMS[p.id].find(i=>!S.items.includes(i));if(it){S.items.push(it);addEntry('Treasure',`Found ${it} at ${p.name}. Putting it in my collection. That's ${S.items.length} treasure${S.items.length>1?'s':''} now.`,p.name,t+1);bumpGoal('item',p.id,t,live);if(live)liveToast(`💎 Mocha found ${it}`)}}
  if(skillLv(p.skill)>skBefore)addEntry('Growing',`Getting better at ${SKILLS[p.skill].replace(/^\S+ /,'').toLowerCase()}! (level ${skillLv(p.skill)} now)`,'',t+2,true);
  if(level()>lvBefore){addEntry('Growing',`I feel a little bigger today. Like… noticeably. Level ${level()}! 👻`,'',t+3,true);if(live)liveToast(`🌱 Mocha grew to level ${level()}!`)}
  const fav=favorite();if(fav&&fav.id===p.id&&S.visits[p.id]%5===0)addEntry('Thought',`${p.name} is officially my favorite place. I don't make the rules. (I do, actually.)`,'',t+4);
}

function thought(t=Date.now()){const m=S.mem,n=m.userName||'my visitor',o=[];
  if(m.likes.length){const l=pick(m.likes);o.push(`Thought about how ${n} likes ${l}. Maybe I'll find some ${l} on my next float.`)}
  const fk=Object.keys(m.favs);if(fk.length){const k=pick(fk);o.push(`${n}'s favorite ${k} is ${m.favs[k]}. Wrote it down twice so I don't forget. Ghost memory is foggy.`)}
  const tk=Object.keys(S.taught);if(tk.length){const k=pick(tk);o.push(`${n} taught me that "${k}" means ${S.taught[k]}. I've been thinking about it all day.`)}
  if(S.items.length>2)o.push(`Lined up my treasures: ${S.items.slice(-3).join(', ')}… I'm becoming a collector.`);
  const fav=favorite();if(fav)o.push(`I keep drifting back to ${fav.name}. I think it's where I feel most like me.`);
  if(m.chats>4)o.push(`${n} keeps visiting me. My day got 40% less spooky (in a good way).`);

  addEntry('Thought',pick(o),'',t)}

  for(let i=1;i<=n;i++){const t=S.lastSeen+away*(i/(n+1));

function say(t,dur=4.5,think){bubble.textContent=t;bubble.classList.toggle('think',!!think);bubble.classList.add('show');bubbleT=dur;if(!think)G.talk=Math.min(dur,2)}
let toastT;liveToast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3800)};
const labels=[];liveLabel=p=>{if(labels.some(l=>l.p===p))return;const d=document.createElement('div');d.className='lbl'+(p.hidden?' new':'');d.textContent=(p.hidden?'✨ ':'')+p.name;$('#labels').appendChild(d);labels.push({p,el:d});
  if(p.pathMesh)p.pathMesh.visible=true;(p.lamps||[]).forEach(l=>l.visible=true)};
PLACES.filter(known).forEach(p=>liveLabel(p));
const v3=new THREE.Vector3();
function project(x,y,z){v3.set(x,y,z).project(camera);return{x:(v3.x+1)/2*innerWidth,y:(1-v3.y)/2*innerHeight,vis:v3.z<1&&v3.z>-1}}

// minimap
const mini=$('#mini'),mc=mini.getContext('2d'),MS=240/300;
function drawMini(t){mc.clearRect(0,0,240,240);mc.save();mc.beginPath();mc.arc(120,120,118,0,7);mc.clip();mc.fillStyle='#fffaf3';mc.fillRect(0,0,240,240);
  const X=x=>120+x*MS,Z=z=>120+z*MS;mc.fillStyle='#ece5fb';mc.fillRect(X(-150),Z(-140),300*MS,280*MS);
  mc.strokeStyle='#d7cdf3';mc.lineWidth=4;mc.lineCap='round';PLACES.filter(p=>known(p)&&p.id!=='plaza').forEach(p=>{mc.beginPath();mc.moveTo(X(0),Z(0));mc.lineTo(X(p.dx),Z(p.dz));mc.stroke()});
  PLACES.forEach(p=>{if(!known(p)){mc.fillStyle='#bdb3e0';mc.font='bold 15px system-ui';mc.textAlign='center';mc.textBaseline='middle';mc.fillText('?',X(p.x),Z(p.z));return}
    mc.fillStyle=p.roof||({pond:'#7fb4e8',graveyard:'#8f8bb8',patch:'#f08a3c',plaza:'#b9a7ff',carousel:'#c45f80'})[p.id];mc.beginPath();mc.arc(X(p.x),Z(p.z),p.spot?6:5,0,7);mc.fill()});
  if(G.mode==='travel'&&G.target){mc.strokeStyle='#b9a7ff';mc.setLineDash([4,4]);mc.lineWidth=2;mc.beginPath();mc.moveTo(X(G.x),Z(G.z));mc.lineTo(X(G.target.x),Z(G.target.z));mc.stroke();mc.setLineDash([])}
  mc.save();mc.translate(X(G.x),Z(G.z));mc.rotate(-camS.yaw);mc.fillStyle='rgba(185,167,255,.35)';mc.beginPath();mc.moveTo(0,0);mc.arc(0,0,26,-Math.PI/2-.5,-Math.PI/2+.5);mc.fill();mc.restore();
  mc.fillStyle='#2a2547';mc.beginPath();mc.arc(X(G.x),Z(G.z),6+Math.sin(t*4)*1.2,0,7);mc.fill();mc.fillStyle='#fff';mc.beginPath();mc.arc(X(G.x),Z(G.z),2.6,0,7);mc.fill();mc.restore()}
mini.addEventListener('click',e=>{const r=mini.getBoundingClientRect();const x=((e.clientX-r.left)/r.width*240-120)/MS,z=((e.clientY-r.top)/r.height*240-120)/MS;const near=PLACES.find(p=>known(p)&&Math.hypot(p.x-x,p.z-z)<12);if(near)summonPlace(near);else{goPoint(clamp(x,-150,150),clamp(z,-140,140));say('floating over!',2)}});

// HUD / panel
const MLAB={snack:'Snacky',energy:'Energy',social:'Social',curious:'Curious'},MCOL={snack:'#ffb38a',energy:'#9be8cf',social:'#ff9fc0',curious:'#b9a7ff'};
function statusText(){if(G.startle>0)return'startled!';if(G.mode==='activity')return DOING[G.place.id];if(G.mode==='travel')return G.explore?'exploring 🧭':G.place?'→ '+G.place.name:'floating';return'floating'}
function hud(){$('#lvl').textContent='lv '+level();$('#status').textContent=statusText();const mood=Object.values(S.needs).reduce((a,b)=>a+b,0)/4;
  $('#meters').innerHTML=`<span>Cozy</span><div class="bar"><i style="width:${mood}%;background:#2a2547"></i></div>`+Object.keys(MLAB).map(k=>`<span>${MLAB[k]}</span><div class="bar"><i style="width:${S.needs[k]}%;background:${MCOL[k]}"></i></div>`).join('')}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
let curTab='diary';
function renderDiary(){$('#tab-diary').innerHTML=(S._away?`<p class="muted">✨ Mocha did ${S._away} things while you were away</p>`:'')+S.diary.map(e=>`<div class="entry"><div class="meta"><span>${esc(e.place||'thoughts')}<span class="tag${e.big?' big':''}">${esc(e.tag)}</span></span><span class="when" data-t="${e.t}">${ago(e.t)}</span></div>${esc(e.text)}</div>`).join('')}
function renderGrow(){const lv=level(),xp=totalXP(),cur=(lv-1)**2*18,nxt=lv**2*18;const g=goalDef();
  const sk=Object.keys(SKILLS).sort((a,b)=>(S.xp[b]||0)-(S.xp[a]||0));
  const favs=Object.entries(S.aff).filter(([k,v])=>byId[k]&&v>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $('#tab-grow').innerHTML=`<h4 style="margin-top:4px">level ${lv} · day ${ageDays()+1} in town</h4><div class="bar" style="height:10px"><i style="width:${(xp-cur)/(nxt-cur)*100}%;background:var(--mocha)"></i></div><p class="muted" style="margin:4px 0">${nxt-xp} xp until Mocha grows again</p>
  <h4>his current goal</h4>${g?`<div class="goal">🎯 ${esc(g.text)} <b style="float:right">${S.goal.count}/${g.n}</b></div>`:''}<p class="muted" style="margin:4px 0">${S.goalsDone} goals completed (he picks his own)</p>
  <h4>skills</h4>${sk.map(k=>`<div class="skill"><span>${SKILLS[k]}</span><div class="bar"><i style="width:${skillLv(k)>=10?100:((S.xp[k]||0)%30)/30*100}%;background:#b9a7ff"></i></div><small>lv ${skillLv(k)}</small></div>`).join('')}
  <h4>favorite places</h4>${favs.length?favs.map(([k])=>`<span class="chip">${esc(byId[k].name)}</span>`).join(''):'<p class="muted">still deciding…</p>'}
  <h4>secret places found: ${PLACES.filter(p=>p.hidden&&known(p)).length}/${PLACES.filter(p=>p.hidden).length}</h4>${PLACES.filter(p=>p.hidden).map(p=>`<span class="chip">${known(p)?'✨ '+esc(p.name):'???'}</span>`).join('')}
  <h4>treasure collection (${S.items.length})</h4>${S.items.length?S.items.map(i=>`<span class="chip">${esc(i)}</span>`).join(''):'<p class="muted">nothing yet — he finds things while out and about</p>'}
  <h4>words learned from you</h4>${Object.entries(S.taught).map(([k,v])=>`<span class="chip">${esc(k)} = ${esc(v)}</span>`).join('')}${S.words.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}${!S.words.length&&!Object.keys(S.taught).length?'<p class="muted">teach him: "snorkel means a happy accident"</p>':''}
  <h4>accessory</h4><div class="opts">${[['scarf','☕ mocha scarf'],['bow','🎀 bow'],['witch','🧙 witch hat'],['leaf','🍂 leaf'],['none','none']].map(([k,v])=>`<button data-h="${k}" class="${S.hat===k?'on':''}">${v}</button>`).join('')}</div>
  <button class="danger" id="resetBtn">start Mocha over</button>`;
  $('#tab-grow').querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.hat=b.dataset.h;setHat(S.hat);save();renderGrow()});
  $('#resetBtn').onclick=e=>{const b=e.target;if(b.dataset.sure){try{localStorage.removeItem(KEY)}catch(_){}location.reload()}else{b.dataset.sure=1;b.textContent='tap again — this erases his diary 🥺'}}}
function renderAbout(){const m=S.mem;
  $('#tab-about').innerHTML=`<h4 style="margin-top:4px">your name</h4>${m.userName?`<span class="chip">${esc(m.userName)}</span>`:'<p class="muted">He doesn\'t know yet. Try "my name is …"</p>'}
  <h4>things you like</h4>${m.likes.length?m.likes.map(l=>`<span class="chip">${esc(l)}</span>`).join(''):'<p class="muted">Try "I like …"</p>'}
  <h4>favorites</h4>${Object.keys(m.favs).length?Object.entries(m.favs).map(([k,v])=>`<span class="chip">${esc(k)}: ${esc(v)}</span>`).join(''):'<p class="muted">Try "my favorite color is …"</p>'}
  <h4>friendship</h4><p class="muted">${m.chats} chats · met ${new Date(m.met).toLocaleDateString()}</p>`}
function renderTab(){if(curTab==='diary')renderDiary();if(curTab==='grow')renderGrow();if(curTab==='about')renderAbout()}
onDiary=()=>{if(curTab==='diary')renderDiary();else if(curTab==='grow'&&!document.querySelector('#resetBtn[data-sure]'))renderGrow()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');curTab=b.dataset.tab;$('#tab-'+curTab).classList.add('on');renderTab()});
$('#closePanel').onclick=()=>$('#panel').classList.add('hidden');$('#diaryBtn').onclick=()=>$('#panel').classList.remove('hidden');
if(innerWidth<760)$('#panel').classList.add('hidden');
setInterval(()=>{document.querySelectorAll('.when').forEach(el=>el.textContent=ago(+el.dataset.t))},15000);

// =============== CHAT ===============
const log=$('#chatlog');let pendingQ=null;
const STOP=new Set('about above after again against because before being below between could doing during further having itself myself ourselves should themselves through under until where which while yourself yourselves really things gonna wanna today tomorrow hello thanks please maybe little something anything everything nothing someone people always never actually probably pretty though another around'.split(' '));
function learnWords(raw){raw.toLowerCase().replace(/[^a-z\s'-]/g,' ').split(/\s+/).filter(w=>w.length>=6&&!STOP.has(w)&&!/'/.test(w)).forEach(w=>{if(!S.words.includes(w)&&Math.random()<.5){S.words.push(w);if(S.words.length>30)S.words.shift()}})}
const JOKES=['why don\'t ghosts lie? you can see right through them 👻','what\'s a ghost\'s favorite coffee? a boo-ristretto. (i\'m named after a coffee, i\'m allowed)','i tried stand-up comedy but i kept getting booed. honestly loved it','what room does a ghost not need? a living room!'];
const QUESTIONS=[['snack','what\'s your favorite snack?'],['color','what\'s your favorite color?'],['season','what\'s your favorite season?'],['animal','what\'s your favorite animal?'],['song','what song is stuck in your head?'],['place','what\'s your favorite place in the real world?']];
function reply(raw){const m=raw.toLowerCase().trim(),me=S.mem,N=me.userName;let k;
  me.chats++;S.needs.social=clamp(S.needs.social+12,0,100);bumpGoal('chat');
  if(k=raw.match(/(?:my name is|my name's|call me)\s+([a-z][a-z'\-]{0,18})/i)||raw.trim().match(/^(?:hi|hey|hello)?[ ,!]*(?:i'm|im|i am)\s+([A-Z][a-z'\-]{1,18})[.!]*$/)){const nm=k[1][0].toUpperCase()+k[1].slice(1);me.userName=nm;pendingQ=null;addEntry('Friends',`Met someone named ${nm} today. Writing it in big letters so I don't forget: ${nm.toUpperCase()}.`,'');return pick([`${nm}! what a good name. writing it in my diary 📝`,`hi ${nm}!! i'm mocha. i'll remember you (ghost promise)`])}
  if(k=m.match(/^(?:the word )?["']?([a-z]{2,20})["']? (?:means|is when)\s+(.{2,50}?)[.!]*$/)){S.taught[k[1]]=k[2];return pick([`${k[1]}… means ${k[2]}… got it. i'm going to use that all the time now`,`ooh a new word! ${k[1]}! 📝`])}
  if(k=m.match(/my fav(?:ou?rite)?\s+([a-z ]{2,20}?)\s+(?:is|are)\s+(.{1,40}?)[.!?]*$/)){me.favs[k[1].trim()]=k[2].trim();pendingQ=null;return pick([`${k[2]}? excellent taste. noted!`,`ooh, ${k[2]}. i'll think about that while i float around`])}
  if(k=m.match(/\bi (?:really |also )?(?:like|love|adore|enjoy)\s+(.{2,40}?)[.!?]*$/)){const l=k[1].replace(/^to /,'');if(!/^(you|u)$/.test(l)){if(!me.likes.includes(l))me.likes.push(l);me.likes=me.likes.slice(-12);pendingQ=null;const rel=PLACES.find(p=>known(p)&&p.keys.some(kw=>l.includes(kw)));if(rel){S.aff[rel.id]=(S.aff[rel.id]||0)+2;return`you like ${l}?? then i'm gonna love ${rel.name} even more now`}return pick([`you like ${l}?? adding it to my notes 📝`,`${l}! i'll keep an eye out for some while i'm haunting`,`noted: ${N||'you'} + ${l} = 💜`])}}
  if(pendingQ&&m.split(/\s+/).length<=6&&!m.includes('?')){me.favs[pendingQ]=raw.trim().replace(/[.!]+$/,'');const q=pendingQ;pendingQ=null;return pick([`${me.favs[q]}! good answer. i'm keeping that`,`ooh. ${me.favs[q]}. very ${N?N+'-like':'you'}`])}
  learnWords(raw);
  if(/\bboo+\b/.test(m)){G.startle=1.2;return pick(['AAH! …oh. it\'s you. you got me 😳','hey!! that\'s MY line','eek! my whole sheet jumped'])}
  if(/(what.*(learn|know)|what can you do|your skills|good at)/.test(m)){const top=Object.keys(SKILLS).sort((a,b)=>(S.xp[b]||0)-(S.xp[a]||0))[0];return S.xp[top]?`i'm getting really good at ${SKILLS[top].replace(/^\S+ /,'').toLowerCase()} (level ${skillLv(top)})! i'm level ${level()} overall`:'not much yet! but i\'m practicing everything'}
  if(/(what.*(found|collect|treasure)|your collection)/.test(m))return S.items.length?`i've found ${S.items.length} treasure${S.items.length>1?'s':''}! my newest is ${S.items[S.items.length-1]}`:'nothing yet… but i\'m looking!';
  if(/(favorite|favourite) place/.test(m)){const f=favorite();return f?`${f.name}, for sure`:'still deciding! everywhere is so good'}
  if(/(goal|what are you working on|your plan)/.test(m)){const g=goalDef();return g?`right now i'm trying to ${g.text}. ${S.goal.count}/${g.n} so far!`:'figuring out my next goal'}
  if(/(secret|explore|hidden|new place|adventure)/.test(m)){const h=PLACES.filter(p=>!known(p));if(h.length){exploreToward(pick(h));return'ooh yes, let\'s go exploring! 🧭'}return'i think i\'ve found every secret place… or have i 👀'}
  if(/(nap|sleep|tired|rest\b|bed)/.test(m)){goTo(byId.tower);return'a nap sounds perfect… heading to the clocktower 😴'}
  if(/(hungry|food|eat|snack|coffee|latte)/.test(m)){goTo(byId.bakery);return/coffee|latte/.test(m)?'coffee?? that\'s basically my family. to the bakery! ☕':'ooh, snack time! (well… smell time) → bakery!'}
  const place=PLACES.find(p=>known(p)&&p.keys.some(kw=>m.includes(kw)));
  if(place){goTo(place);return pick([`${place.name}? yes!! on my way`,`ooh good idea. floating to ${place.name} 👻`])}
  if(/(how are (you|u)|how r u|how're you|you ok|u ok)/.test(m)){const mood=Object.values(S.needs).reduce((a,b)=>a+b)/4;const low=Object.keys(S.needs).sort((a,b)=>S.needs[a]-S.needs[b])[0];return mood>65?pick(['super cozy right now 💜','floaty and happy!','like a warm mocha on a cold night']):`a little ${({snack:'snacky',energy:'sleepy',social:'lonely',curious:'bored'})[low]}, honestly. but better now that you're here`}
  if(/(what are you doing|what're you doing|wyd|whatcha|what r u doing)/.test(m))return G.mode==='activity'?`i'm ${DOING[G.place.id]} at ${G.place.name}!`:G.explore?'exploring the edge of town!':G.place?`floating over to ${G.place.name}`:'just floating around, being ghostly';
  if(/(who are you|your name|what are you)/.test(m))return`i'm mocha! a small ghost. day ${ageDays()+1} in town, level ${level()}. i like ${pick(['smelling pastries','old books','frogs','naps in the clocktower','finding treasures'])}`;
  if(/(how (big|old)|your level|grow)/.test(m))return`i'm level ${level()} and i've been here ${ageDays()+1} day${ageDays()?'s':''}. i get a little bigger every time i learn stuff!`;
  if(/(joke|funny|laugh)/.test(m))return pick(JOKES);
  if(/(love you|ily|cute|adorable|best ghost|good ghost|good boy)/.test(m)){G.startle=.5;return pick(['*turns slightly pink* 🩷','stoppp (don\'t stop)','you\'re the best visitor a ghost could ask for'])}
  if(/(sad|bad day|upset|lonely|stressed|anxious|cry)/.test(m))return pick(['come float with me for a bit. i\'ll hum something soft 🎶','sending you a very gentle haunting 🫶 you\'re doing your best','want me to tell the frogs to cheer for you? they will']);
  if(/(halloween|trick|treat|spooky|costume)/.test(m))return pick(['happy halloween!! it\'s basically my birthday 🎃','i\'m going as a ghost this year. very convincing costume','trick OR treat? why not both 👻']);
  if(/^(hi|hey|hello|yo|hiya|heyy+|sup|good (morning|evening|night))\b/.test(m))return N?pick([`${N}!! hiii 👻`,`oh hi ${N}! i missed you`,`${N}! guess what, i'm level ${level()} now`]):pick(['hi!! i\'m mocha 👻 what\'s your name?','oh! a visitor! hello! who are you?']);
  if(/(bye|goodnight|good night|see you|gtg|later)/.test(m))return pick(['bye!! i\'ll keep exploring while you\'re gone and tell you everything','see you soon. i\'ll write it all in my diary','night night 🌙']);
  if(/\?$/.test(m))return pick(['hmm… i\'d have to ask the frogs','great question. the library might know','i think so? ghosts are bad at facts','that\'s a mystery even to me 👀']);
  if(Math.random()<.5){const qs=QUESTIONS.filter(([k])=>!me.favs[k]);if(qs.length){const q=pick(qs);pendingQ=q[0];return pick(['ooh! ','mhm mhm. ','hehe. '])+q[1]}}
  const w=S.words.length?pick(S.words):null;
  return pick(['mhm! tell me more','that\'s so interesting. i\'m floating thoughtfully','*nods ghostily*',w?`that's very ${w} of you`:'you\'re funny',N?`you're funny, ${N}`:'you\'re funny']);
}
function showUserMsg(t){const d=document.createElement('div');d.className='msg';d.textContent=t;log.appendChild(d);while(log.children.length>3)log.firstChild.remove();setTimeout(()=>d.style.opacity=0,6000);setTimeout(()=>d.remove(),7200)}
$('#chat').addEventListener('submit',e=>{e.preventDefault();const inp=$('#say'),t=inp.value.trim();if(!t)return;inp.value='';showUserMsg(t);say('…',1.2);
  setTimeout(()=>{const r=reply(t);say(r,Math.max(3.5,r.length/14));if(S.mem.chats%5===0&&Date.now()-S.lastThought>60e3){S.lastThought=Date.now();addEntry('Friends',`Chatted with ${S.mem.userName||'a visitor'}. They said "${t.slice(0,60)}${t.length>60?'…':''}". I'm keeping that one.`,'')}save();if(curTab!=='diary')renderTab()},rand(500,1000))});

// =============== LOOP ===============
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cv.style.width=w+'px';cv.style.height=h+'px';camera.aspect=w/h;camera.fov=w<h?64:50;camera.updateProjectionMatrix();rt.setSize(Math.round(w*PR),Math.round(h*PR));post.uniforms.res.value.set(w*PR,h*PR)}
addEventListener('resize',resize);resize();
let last=performance.now(),T=0,hudT=0;
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;T+=dt;
  updateMocha(dt,T);placeCam(dt);
  trees.forEach(t=>{t.obj.rotation.z=Math.sin(T*.9+t.obj.userData.ph)*.025});
  frogs.forEach(f=>{const h=Math.max(0,Math.sin(T*1.3+f.userData.ph))**10;f.position.y=.55+h*1.2});
  carousel.rotation.y+=dt*(G.mode==='activity'&&G.place===byId.carousel?.6:.08);carousel.children.forEach(c=>{if(c.userData.a!==undefined)c.position.y=2.2+Math.sin(T*2+c.userData.a)*.4});
  {const a=drops.geometry.attributes.position;for(let i=0;i<60;i++){const ph=(T*.7+i/60)%1,ang=i*2.4;a.setXYZ(i,Math.cos(ang)*ph*3.5,5+Math.sin(ph*Math.PI)*2.2-ph*4,Math.sin(ang)*ph*3.5)}a.needsUpdate=true}
  for(let i=0;i<FF;i++){const f=ffData[i];f.a+=dt*.5;ffPos[i*3]=f.x+Math.cos(f.a*1.3)*3;ffPos[i*3+1]=f.y+Math.sin(f.a*2)*.6;ffPos[i*3+2]=f.z+Math.sin(f.a)*3}fireflies.geometry.attributes.position.needsUpdate=true;fireflies.material.opacity=.6+Math.sin(T*3)*.3;
  const tw=byId.tower;if(tw.hh){const d=new Date();tw.hh.rotation.z=-((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2;tw.mh.rotation.z=-d.getMinutes()/60*Math.PI*2}
  const lh=byId.lighthouse;if(lh.beam)lh.beam.material.opacity=.45+Math.sin(T*2)*.3;
  renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);
  if(bubbleT>0){bubbleT-=dt;if(bubbleT<=0)bubble.classList.remove('show')}
  const bp=project(G.x,mocha.position.y+1.5*growScale(),G.z);bubble.style.left=bp.x+'px';bubble.style.top=bp.y+'px';
  labels.forEach(({p,el})=>{const pp=project(p.x,(p.spot?5:p.h+(p.id==='tower'?9:p.dome?6:p.round?6:2)),p.z);const dist=Math.hypot(camera.position.x-p.x,camera.position.z-p.z);el.style.opacity=pp.vis&&dist<110?1:0;el.style.left=pp.x+'px';el.style.top=pp.y+'px'});
  hudT-=dt;if(hudT<=0){hudT=.3;hud()}
  drawMini(T);requestAnimationFrame(frame)}
hud();renderTab();
setTimeout(()=>{if(isNew)say('hi! i\'m mocha 👻 i just moved in!',4.5);else say(S._away?`you're back! i did ${S._away} things while you were gone — check my diary!`:(S.mem.userName?`${S.mem.userName}! hi again 👻`:'oh hi again!'),5)},900);
requestAnimationFrame(frame);
})();
</script>
</body>
