# One-click deploy config for Render (https://render.com).
# In Render: New + → Blueprint → point at this repo → set ANTHROPIC_API_KEY.
services:
  - type: web
    name: bennett-archive
    runtime: node
    plan: free
    rootDir: archive-app
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      # Optional — live "orders today" from Shopify. Leave unset to skip.
      - key: SHOPIFY_STORE
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
